name: animated_streaming_markdown
description: "Flutter markdown streaming package for Android/iOS/macOS/Linux/Windows/web, with Tree-sitter WASM and KaTeX math support."
version: 0.3.6
homepage: https://samnn.dev
repository: https://github.com/samnn152/streaming-markdown
issue_tracker: https://github.com/samnn152/streaming-markdown/issues
documentation: https://samnn.dev
topics:
  - markdown
  - streaming
  - flutter
  - animation
  - tree-sitter

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: '>=2.0.1 <3.0.0'
  flutter_math_fork: ^0.7.4
  html: '>=0.15.0 <0.16.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=2.0.0 <7.0.0'

flutter:
  assets:
    - assets/wasm/
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
